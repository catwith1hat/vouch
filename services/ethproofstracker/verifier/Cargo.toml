[package]
name = "ethproofs-verifier"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# SP1 verifier for Succinct's zkVM
sp1-verifier = { version = "4.0", default-features = false }

# Note: ZKM/Ziren verifier may need to be added when available
# For now, we'll focus on SP1 which is the most widely used

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
